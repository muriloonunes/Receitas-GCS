<div class="recipe-list-container">
  <header class="recipe-list-header">
    <h2>Minhas Receitas</h2>
    <p-button label="Nova Receita" icon="pi pi-plus" routerLink="/receitas/nova"></p-button>
  </header>

  @if (receitas.length === 0) {
    <div class="recipe-empty-state">
      <p class="recipe-empty-state-text">Nenhuma receita encontrada.</p>
    </div>
  }

  <div class="recipe-grid">
    @for (receita of receitas; track receita) {
      <div class="recipe-card-wrapper">
        <p-card [header]="receita.nome" [subheader]="receita.categoria">
          <div class="recipe-prep-time">
            <i class="pi pi-clock"></i>
            <span>Tempo de preparo: {{ receita.tempoPreparo }} min</span>
          </div>
          <ng-template #footer>
            <p-button label="Ver Detalhes" icon="pi pi-eye" styleClass="recipe-card-action p-button-outlined"
                      [routerLink]="['/receitas', receita.id]"></p-button>
          </ng-template>
        </p-card>
      </div>
    }
  </div>
</div>
